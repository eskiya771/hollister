services:
  hollister:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      BROWSER_PROFILE_DIR: /data/browser-profile
      CHECK_MODE: browser
      CHECK_INTERVAL_SECONDS: '900'
    init: true
    stop_grace_period: 90s
    volumes:
      - browser-data:/data
    tmpfs:
      - /tmp:size=512m,mode=1777
    shm_size: 512m
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
  manual-browser: &manual_browser
    profiles: [manual]
    build:
      context: .
      target: manual
    env_file: .env
    environment:
      BROWSER_PROFILE_DIR: /data/browser-profile
    init: true
    restart: 'no'
    stop_grace_period: 30s
    ports:
      - '127.0.0.1:6080:6080'
    volumes:
      - browser-data:/data
    tmpfs:
      - /tmp:size=512m,mode=1777
    shm_size: 512m
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
  session-monitor:
    <<: *manual_browser
    profiles: [session]
    restart: unless-stopped
    stop_grace_period: 90s
    environment:
      BROWSER_PROFILE_DIR: /data/browser-profile
      SESSION_MONITOR: '1'
      CHECK_INTERVAL_SECONDS: '900'
      PRODUCT_SIZES: 'XS,S'
      VERIFY_S_ONCE: '${VERIFY_S_ONCE:-0}'
volumes:
  browser-data:
    external: true
    name: hollister_browser-data
